<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Localização com Mapa</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.75rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    header {
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    p.subtitle {
      color: var(--text-secondary);
      font-size: 0.875rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.4rem;
      color: var(--text-primary);
    }

    input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    input[readonly] {
      color: var(--text-secondary);
      cursor: not-allowed;
      background-color: rgba(15, 23, 42, 0.6);
    }

    .coords-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    /* Container do Mapa Leaflet */
    .map-wrapper {
      margin-bottom: 1rem;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }

    #map {
      height: 220px;
      width: 100%;
      background-color: #0b1120;
      z-index: 1;
    }

    .map-hint {
      background-color: rgba(15, 23, 42, 0.85);
      color: var(--text-secondary);
      font-size: 0.75rem;
      padding: 0.35rem 0.6rem;
      text-align: center;
      border-top: 1px solid var(--border);
    }

    .gps-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--border);
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      margin-bottom: 1.25rem;
      font-size: 0.825rem;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--warning);
      flex-shrink: 0;
    }

    .dot.active { background-color: var(--success); }
    .dot.error { background-color: var(--error); }

    .btn-refresh {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .btn-refresh:hover {
      background: var(--border);
    }

    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 8px;
      background-color: var(--accent);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .btn-submit:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .toast {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }

    .toast.success {
      display: block;
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--success);
      color: var(--success);
    }

    .toast.error {
      display: block;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error);
      color: var(--error);
    }
  </style>
</head>
<body>

  <main class="container">
    <header>
      <h1>Check-in de Localização</h1>
      <p class="subtitle">Confirme o pino no mapa e envie o registro.</p>
    </header>

    <form id="geoForm">
      <div class="form-group">
        <label for="local">Nome do Local</label>
        <input 
          type="text" 
          id="local" 
          name="entry.690706598" 
          placeholder="Ex: Portaria Principal, Setor B..." 
          required 
          autocomplete="off"
        >
      </div>

      <div class="map-wrapper">
        <div id="map"></div>
        <div class="map-hint">Arraste o marcador caso precise ajustar o ponto exato</div>
      </div>

      <div class="coords-grid">
        <div class="form-group">
          <label for="latitude">Latitude</label>
          <input 
            type="text" 
            id="latitude" 
            name="entry.1565294304" 
            placeholder="Aguardando..." 
            readonly 
            required
          >
        </div>

        <div class="form-group">
          <label for="longitude">Longitude</label>
          <input 
            type="text" 
            id="longitude" 
            name="entry.612983124" 
            placeholder="Aguardando..." 
            readonly 
            required
          >
        </div>
      </div>

      <div class="gps-status">
        <div class="status-indicator">
          <span class="dot" id="gpsDot"></span>
          <span id="gpsText">Obtendo coordenadas GPS...</span>
        </div>
        <button type="button" class="btn-refresh" id="btnRefresh" title="Recalibrar via GPS">
          Recalibrar
        </button>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit" disabled>
        Registrar Localização
      </button>

      <div id="feedback" class="toast" role="alert"></div>
    </form>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    const FORM_ACTION_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSf_rnqKDB-wdYD3PIxkgKafM8PtugWNWbRe7ufbUTyORsnhUg/formResponse';

    const form = document.getElementById('geoForm');
    const localInput = document.getElementById('local');
    const latInput = document.getElementById('latitude');
    const lngInput = document.getElementById('longitude');
    const gpsDot = document.getElementById('gpsDot');
    const gpsText = document.getElementById('gpsText');
    const btnRefresh = document.getElementById('btnRefresh');
    const btnSubmit = document.getElementById('btnSubmit');
    const feedback = document.getElementById('feedback');

    // Estado do Mapa
    let map = null;
    let marker = null;
    let accuracyCircle = null;

    function initMap() {
      // Inicializa centrado no Brasil antes da captura do GPS
      map = L.map('map', {
        zoomControl: true,
        attributionControl: false
      }).setView([-14.235, -51.925], 4);

      // Camada escura nativa (CartoDB Dark Matter)
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19
      }).addTo(map);
    }

    function updateMapPosition(lat, lng, accuracy = null) {
      const coords = [lat, lng];

      if (!marker) {
        marker = L.marker(coords, { draggable: true }).addTo(map);
        
        // Atualiza inputs se o usuário arrastar o pino manualmente
        marker.on('dragend', (event) => {
          const position = event.target.getLatLng();
          latInput.value = position.lat.toFixed(6);
          lngInput.value = position.lng.toFixed(6);
          
          if (accuracyCircle) {
            accuracyCircle.remove();
            accuracyCircle = null;
          }
          updateGpsStatus('success', 'Posição ajustada manualmente');
        });
      } else {
        marker.setLatLng(coords);
      }

      // Desenha/atualiza o raio de precisão do GPS
      if (accuracy !== null) {
        if (accuracyCircle) {
          accuracyCircle.setLatLng(coords).setRadius(accuracy);
        } else {
          accuracyCircle = L.circle(coords, {
            radius: accuracy,
            color: '#3b82f6',
            fillColor: '#3b82f6',
            fillOpacity: 0.15,
            weight: 1
          }).addTo(map);
        }
      }

      map.setView(coords, 17, { animate: true });
    }

    function updateGpsStatus(state, message) {
      gpsDot.className = 'dot';
      if (state === 'success') gpsDot.classList.add('active');
      if (state === 'error') gpsDot.classList.add('error');
      gpsText.textContent = message;
    }

    function fetchCoordinates() {
      btnSubmit.disabled = true;
      updateGpsStatus('loading', 'Buscando sinal GPS...');

      if (!('geolocation' in navigator)) {
        updateGpsStatus('error', 'Geolocalização não suportada.');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const { latitude, longitude, accuracy } = position.coords;
          latInput.value = latitude.toFixed(6);
          lngInput.value = longitude.toFixed(6);
          
          updateMapPosition(latitude, longitude, accuracy);
          updateGpsStatus('success', `GPS ativo (precisão: ~${Math.round(accuracy)}m)`);
          btnSubmit.disabled = false;
        },
        (error) => {
          let msg = 'Erro ao obter localização.';
          if (error.code === error.PERMISSION_DENIED) msg = 'Permissão de GPS negada.';
          if (error.code === error.POSITION_UNAVAILABLE) msg = 'Sinal GPS indisponível.';
          if (error.code === error.TIMEOUT) msg = 'Tempo limite esgotado.';
          updateGpsStatus('error', msg);
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    function showFeedback(type, message) {
      feedback.className = `toast ${type}`;
      feedback.textContent = message;
      setTimeout(() => {
        feedback.className = 'toast';
      }, 5000);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!latInput.value || !lngInput.value) {
        showFeedback('error', 'Aguarde a captura das coordenadas GPS.');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Enviando...';

      const formData = new URLSearchParams();
      formData.append('entry.690706598', localInput.value.trim());
      formData.append('entry.1565294304', latInput.value);
      formData.append('entry.612983124', lngInput.value);

      try {
        await fetch(FORM_ACTION_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: formData.toString()
        });

        showFeedback('success', 'Registro enviado com sucesso!');
        localInput.value = '';
      } catch (err) {
        showFeedback('error', 'Falha de rede ao enviar os dados.');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Registrar Localização';
      }
    });

    btnRefresh.addEventListener('click', fetchCoordinates);

    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      fetchCoordinates();
    });
  </script>
</body>
</html>
