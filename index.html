<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Localização</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.75rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    header {
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    p.subtitle {
      color: var(--text-secondary);
      font-size: 0.875rem;
    }

    .form-group {
      margin-bottom: 1rem;
      position: relative;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.4rem;
      color: var(--text-primary);
    }

    input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Busca de Endereço (Nominatim) */
    .search-box {
      display: flex;
      gap: 0.5rem;
    }

    .btn-search {
      background-color: var(--border);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .btn-search:hover {
      background-color: #475569;
    }

    .search-results {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background-color: var(--bg-color);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 0.35rem;
      max-height: 200px;
      overflow-y: auto;
      z-index: 1000;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6);
      display: none;
    }

    .search-results.open {
      display: block;
    }

    .search-item {
      padding: 0.65rem 0.85rem;
      font-size: 0.825rem;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      line-height: 1.35;
    }

    .search-item:last-child {
      border-bottom: none;
    }

    .search-item:hover {
      background-color: var(--card-bg);
      color: var(--accent);
    }

    .search-empty {
      padding: 0.75rem;
      font-size: 0.825rem;
      color: var(--text-secondary);
      text-align: center;
    }

    .coords-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    /* Container do Mapa Leaflet */
    .map-wrapper {
      margin-bottom: 1rem;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }

    #map {
      height: 240px;
      width: 100%;
      background-color: #1e293b;
      z-index: 1;
    }

    .dark-tiles {
      filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
    }

    .map-hint {
      background-color: rgba(15, 23, 42, 0.9);
      color: var(--text-secondary);
      font-size: 0.75rem;
      padding: 0.4rem 0.6rem;
      text-align: center;
      border-top: 1px solid var(--border);
    }

    .gps-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      background-color: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--border);
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      margin-bottom: 1.25rem;
      font-size: 0.8rem;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      overflow: hidden;
    }

    #gpsText {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--warning);
      flex-shrink: 0;
    }

    .dot.active { background-color: var(--success); }
    .dot.paused { background-color: var(--accent); }
    .dot.error { background-color: var(--error); }

    .btn-refresh {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .btn-refresh:hover {
      background: var(--border);
    }

    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 8px;
      background-color: var(--accent);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .btn-submit:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .toast {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }

    .toast.success {
      display: block;
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--success);
      color: var(--success);
    }

    .toast.error {
      display: block;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error);
      color: var(--error);
    }
  </style>
</head>
<body>

  <main class="container">
    <header>
      <h1>Check-in de Localização</h1>
      <p class="subtitle">Busque um endereço, ajuste no mapa ou use o GPS ao vivo.</p>
    </header>

    <form id="geoForm">
      <div class="form-group">
        <label for="local">Nome do Local</label>
        <input 
          type="text" 
          id="local" 
          name="entry.690706598" 
          placeholder="Ex: Portaria Principal, Setor B..." 
          required 
          autocomplete="off"
        >
      </div>

      <!-- Barra de Busca Nominatim -->
      <div class="form-group">
        <label for="addressSearch">Buscar Endereço no Mapa</label>
        <div class="search-box">
          <input 
            type="text" 
            id="addressSearch" 
            placeholder="Digite rua, bairro ou cidade..." 
            autocomplete="off"
          >
          <button type="button" class="btn-search" id="btnSearch">Buscar</button>
        </div>
        <div id="searchResults" class="search-results"></div>
      </div>

      <div class="map-wrapper">
        <div id="map"></div>
        <div class="map-hint">Clique no mapa, arraste o pino ou edite os números abaixo</div>
      </div>

      <div class="coords-grid">
        <div class="form-group">
          <label for="latitude">Latitude</label>
          <input 
            type="number" 
            step="any"
            id="latitude" 
            name="entry.1565294304" 
            placeholder="-23.000000" 
            required
          >
        </div>

        <div class="form-group">
          <label for="longitude">Longitude</label>
          <input 
            type="number" 
            step="any"
            id="longitude" 
            name="entry.612983124" 
            placeholder="-46.000000" 
            required
          >
        </div>
      </div>

      <div class="gps-status">
        <div class="status-indicator">
          <span class="dot" id="gpsDot"></span>
          <span id="gpsText">Iniciando GPS em tempo real...</span>
        </div>
        <button type="button" class="btn-refresh" id="btnRefresh">
          Seguir GPS
        </button>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">
        Registrar Localização
      </button>

      <div id="feedback" class="toast" role="alert"></div>
    </form>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    const FORM_ACTION_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSf_rnqKDB-wdYD3PIxkgKafM8PtugWNWbRe7ufbUTyORsnhUg/formResponse';

    const form = document.getElementById('geoForm');
    const localInput = document.getElementById('local');
    const searchInput = document.getElementById('addressSearch');
    const btnSearch = document.getElementById('btnSearch');
    const searchResults = document.getElementById('searchResults');
    const latInput = document.getElementById('latitude');
    const lngInput = document.getElementById('longitude');
    const gpsDot = document.getElementById('gpsDot');
    const gpsText = document.getElementById('gpsText');
    const btnRefresh = document.getElementById('btnRefresh');
    const btnSubmit = document.getElementById('btnSubmit');
    const feedback = document.getElementById('feedback');

    let map = null;
    let marker = null;
    let accuracyCircle = null;
    let watchId = null;
    let isAutoTracking = true;
    let searchDebounceTimer = null;

    function initMap() {
      map = L.map('map', {
        zoomControl: true,
        attributionControl: false
      }).setView([-14.235, -51.925], 4);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        className: 'dark-tiles'
      }).addTo(map);

      map.on('click', (e) => {
        pauseAutoTracking('Ponto selecionado no mapa');
        setCoordinates(e.latlng.lat, e.latlng.lng, null, false);
      });
    }

    function setCoordinates(lat, lng, accuracy = null, recenterMap = true, zoomLevel = null) {
      const coords = [lat, lng];
      latInput.value = lat.toFixed(6);
      lngInput.value = lng.toFixed(6);

      if (!marker) {
        marker = L.marker(coords, { draggable: true }).addTo(map);

        marker.on('dragstart', () => {
          pauseAutoTracking('Ajustando manualmente...');
        });

        marker.on('dragend', (event) => {
          const pos = event.target.getLatLng();
          setCoordinates(pos.lat, pos.lng, null, false);
          updateGpsStatus('paused', 'Posição manual (GPS pausado)');
        });
      } else {
        marker.setLatLng(coords);
      }

      if (accuracy !== null) {
        if (accuracyCircle) {
          accuracyCircle.setLatLng(coords).setRadius(accuracy);
        } else {
          accuracyCircle = L.circle(coords, {
            radius: accuracy,
            color: '#3b82f6',
            fillColor: '#3b82f6',
            fillOpacity: 0.15,
            weight: 1
          }).addTo(map);
        }
      } else if (accuracyCircle) {
        accuracyCircle.remove();
        accuracyCircle = null;
      }

      if (recenterMap) {
        const targetZoom = zoomLevel !== null ? zoomLevel : (map.getZoom() < 15 ? 17 : map.getZoom());
        map.setView(coords, targetZoom, { animate: true });
      }
    }

    // Busca via Nominatim API (OpenStreetMap)
    async function searchAddress(query) {
      const trimmed = query.trim();
      if (trimmed.length < 3) {
        searchResults.classList.remove('open');
        return;
      }

      searchResults.innerHTML = '<div class="search-empty">Buscando endereço...</div>';
      searchResults.classList.add('open');

      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(trimmed)}&countrycodes=br&limit=5&accept-language=pt-BR`;
        const response = await fetch(url);
        const data = await response.json();

        if (!data || data.length === 0) {
          searchResults.innerHTML = '<div class="search-empty">Nenhum endereço encontrado.</div>';
          return;
        }

        searchResults.innerHTML = '';
        data.forEach((place) => {
          const item = document.createElement('div');
          item.className = 'search-item';
          item.textContent = place.display_name;
          
          item.addEventListener('click', () => {
            const lat = parseFloat(place.lat);
            const lng = parseFloat(place.lon);
            
            pauseAutoTracking('Endereço selecionado via busca');
            setCoordinates(lat, lng, null, true, 17);
            
            // Preenche o nome do local se estiver vazio
            if (!localInput.value.trim()) {
              localInput.value = place.display_name.split(',')[0];
            }
            
            searchInput.value = place.display_name;
            searchResults.classList.remove('open');
          });

          searchResults.appendChild(item);
        });
      } catch (err) {
        searchResults.innerHTML = '<div class="search-empty">Erro ao consultar o serviço de mapas.</div>';
      }
    }

    searchInput.addEventListener('input', () => {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        searchAddress(searchInput.value);
      }, 450);
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        clearTimeout(searchDebounceTimer);
        searchAddress(searchInput.value);
      }
    });

    btnSearch.addEventListener('click', () => {
      clearTimeout(searchDebounceTimer);
      searchAddress(searchInput.value);
    });

    // Fecha o dropdown ao clicar fora da busca
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.form-group')) {
        searchResults.classList.remove('open');
      }
    });

    function updateGpsStatus(state, message) {
      gpsDot.className = 'dot';
      if (state === 'active') gpsDot.classList.add('active');
      if (state === 'paused') gpsDot.classList.add('paused');
      if (state === 'error') gpsDot.classList.add('error');
      gpsText.textContent = message;
    }

    function pauseAutoTracking(reason) {
      isAutoTracking = false;
      updateGpsStatus('paused', reason);
      btnRefresh.textContent = 'Retomar GPS';
    }

    function startRealTimeTracking() {
      isAutoTracking = true;
      btnRefresh.textContent = 'Seguir GPS';
      updateGpsStatus('loading', 'Rastreando GPS...');

      if (!('geolocation' in navigator)) {
        updateGpsStatus('error', 'Navegador sem suporte a GPS.');
        return;
      }

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
      }

      watchId = navigator.geolocation.watchPosition(
        (position) => {
          if (!isAutoTracking) return;

          const { latitude, longitude, accuracy } = position.coords;
          setCoordinates(latitude, longitude, accuracy, true);
          updateGpsStatus('active', `GPS ao vivo (~${Math.round(accuracy)}m)`);
        },
        (error) => {
          if (!isAutoTracking) return;
          let msg = 'Erro no GPS. Busque ou edite manual.';
          if (error.code === error.PERMISSION_DENIED) msg = 'Permissão negada. Busque ou edite.';
          if (error.code === error.POSITION_UNAVAILABLE) msg = 'Sem sinal GPS. Busque ou edite.';
          updateGpsStatus('error', msg);
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    }

    function handleManualInput() {
      const lat = parseFloat(latInput.value);
      const lng = parseFloat(lngInput.value);

      if (!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
        pauseAutoTracking('Coordenadas digitadas');
        const coords = [lat, lng];
        if (!marker) {
          marker = L.marker(coords, { draggable: true }).addTo(map);
        } else {
          marker.setLatLng(coords);
        }
        if (accuracyCircle) {
          accuracyCircle.remove();
          accuracyCircle = null;
        }
        map.setView(coords, map.getZoom() < 15 ? 16 : map.getZoom());
      }
    }

    latInput.addEventListener('input', handleManualInput);
    lngInput.addEventListener('input', handleManualInput);

    btnRefresh.addEventListener('click', () => {
      startRealTimeTracking();
    });

    function showFeedback(type, message) {
      feedback.className = `toast ${type}`;
      feedback.textContent = message;
      setTimeout(() => {
        feedback.className = 'toast';
      }, 5000);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const lat = parseFloat(latInput.value);
      const lng = parseFloat(lngInput.value);

      if (isNaN(lat) || isNaN(lng)) {
        showFeedback('error', 'Informe coordenadas válidas antes de enviar.');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Enviando...';

      // Converte ponto para vírgula para compatibilidade com Google Sheets PT-BR
      const latFormatted = lat.toFixed(6).replace('.', ',');
      const lngFormatted = lng.toFixed(6).replace('.', ',');

      const formData = new URLSearchParams();
      formData.append('entry.690706598', localInput.value.trim());
      formData.append('entry.1565294304', latFormatted);
      formData.append('entry.612983124', lngFormatted);

      try {
        await fetch(FORM_ACTION_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: formData.toString()
        });

        showFeedback('success', 'Localização registrada com sucesso!');
        localInput.value = '';
        searchInput.value = '';
      } catch (err) {
        showFeedback('error', 'Falha de rede ao enviar os dados.');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Registrar Localização';
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      startRealTimeTracking();
    });
  </script>
</body>
</html>
